<!doctype html>
<html>
    <head>
        <script>
            a = 2;
            b = 4;
         function operators(){
            console.log(a + b);
            console.log(a - b);
            console.log(a * b);
            console.log(a / b);
            console.log(a % b);
            console.log(a ** b);
         }
        </script>
    </head>
    <body>
        <h1>Arithematic Operators</h1>
        <button onClick="operators()">Click Me</button>
    </body>
</html>
