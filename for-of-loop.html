    <script>
        //for loop
        let name = "write code step by step"
        // for(let i=0;i<name.length;i++){

        //for of loop 
        for (let char of name) {
            
           
            if (char == "p") {
                break;

              if (char == "e") {
                continue;
            }
            console.log(char);
           
        }
        </script>
