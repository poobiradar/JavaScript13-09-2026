<!doctype html>

<head>
    <script>
        let a = 2;
        let b = 4;
        function operators() {
            a += b;
            console.log(a);
            a -= b;
             console.log(a);
            a *= b;
             console.log(a);
            a /= b;
             console.log(a);
            a %= b;
            console.log(a);
            alert(a);

        }
    </script>
</head>

<body>
    <h1>Assignment Operators</h1>
    <button onclick="operators()">Click Me!</button>
</body>
